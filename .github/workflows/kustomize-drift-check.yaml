# Detect semantic drift between the Helm chart (source of truth) and Kustomize manifests.
# Compares RBAC rules, webhook configurations, and deployment specs.
name: Kustomize Drift Check

on:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    branches:
      - main
      - release-*
      - rhoai-*
    paths:
      - 'config/**'
      - 'charts/**'
      - 'internal/**'
      - 'test/drift/**'
      - '.github/workflows/kustomize-drift-check.yaml'

  push:
    branches:
      - main
      - release-*
      - rhoai-*
    paths:
      - 'config/**'
      - 'charts/**'
      - 'internal/**'
      - 'test/drift/**'
      - '.github/workflows/kustomize-drift-check.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0 # zizmor: ignore[cache-poisoning] caching is intentional for CI jobs
        with:
          go-version-file: go.mod

      - name: Run drift detection
        run: make drift-check

  notify-on-failure:
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    needs: [drift-check]
    uses: ./.github/workflows/_notify-on-failure.yaml
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
