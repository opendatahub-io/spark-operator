apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-pvc
  namespace: spark-test
spec:
  type: Scala
  mode: cluster
  image: quay.io/opendatahub/spark:3.5.7
  imagePullPolicy: Always
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples_2.12-3.5.7.jar
  arguments:
    - "1000"
  sparkVersion: "3.5.7"

  restartPolicy:
    type: Never

  sparkConf:
    # Enable event logging to PVC
    "spark.eventLog.enabled": "true"
    "spark.eventLog.dir": "file:///mnt/spark-event-logs"
    "spark.eventLog.compress": "true"

  driver:
    cores: 1
    memory: "1000m"
    serviceAccount: spark-operator-spark
    volumeMounts:
    - name: event-logs
      mountPath: /mnt/spark-event-logs

  executor:
    cores: 1
    instances: 2
    memory: "1000m"
    volumeMounts:
    - name: event-logs
      mountPath: /mnt/spark-event-logs

  volumes:
  - name: event-logs
    persistentVolumeClaim:
      claimName: spark-event-logs-pvc
