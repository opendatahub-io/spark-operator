# SparkApplication that intentionally fails at runtime.
# The non-existent mainClass/jar causes the driver to start but the
# application to fail, exercising the onFailureRetries restart policy.
#
# Variables (substituted by envsubst):
#   $APP_NAME       - Name of the SparkApplication
#   $APP_NAMESPACE  - Namespace to deploy to
#   $SPARK_IMAGE    - Spark image to use
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  type: Scala
  mode: cluster
  image: ${SPARK_IMAGE}
  imagePullPolicy: IfNotPresent
  mainClass: non.existent.ClassName
  mainApplicationFile: local:///non-existent.jar
  sparkVersion: "3.5.7"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 1
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.5.7
    serviceAccount: spark-operator-spark
    securityContext: {}
  executor:
    cores: 1
    instances: 1
    memory: "512m"
    labels:
      version: 3.5.7
    securityContext: {}
