# SparkApplication that intentionally fails at submission.
# The non-existent serviceAccount causes spark-submit to fail,
# exercising the onSubmissionFailureRetries restart policy.
#
# Variables (substituted by envsubst):
#   $APP_NAME       - Name of the SparkApplication
#   $APP_NAMESPACE  - Namespace to deploy to
#   $SPARK_IMAGE    - Spark image to use
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: ${APP_NAME}
  namespace: ${APP_NAMESPACE}
spec:
  type: Scala
  mode: cluster
  image: ${SPARK_IMAGE}
  imagePullPolicy: IfNotPresent
  mainClass: dummy
  mainApplicationFile: local:///dummy.jar
  sparkVersion: "3.5.7"
  restartPolicy:
    type: OnFailure
    onSubmissionFailureRetries: 2
    onSubmissionFailureRetryInterval: 1
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.5.7
    serviceAccount: non-existent-sa
    securityContext: {}
  executor:
    cores: 1
    instances: 1
    memory: "512m"
    labels:
      version: 3.5.7
    securityContext: {}
