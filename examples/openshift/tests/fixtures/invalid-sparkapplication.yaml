# SparkApplication with an invalid DNS-1035 name.
# The validating webhook should reject this on creation because
# names starting with a digit are not valid DNS-1035 labels.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: 123_invalid_name
  namespace: spark-operator
spec:
  type: Scala
  mode: cluster
  image: quay.io/rishasin/docling-spark@sha256:7e8431fc89dbc6c10aec1f0401aadd9c9cd66b9728fbcb98f6bf40ba3e3b4cdb
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples_2.12-3.5.7.jar
  sparkVersion: "3.5.7"
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.5.7
    serviceAccount: spark-operator-spark
    securityContext: {}
  executor:
    cores: 1
    instances: 1
    memory: "512m"
    labels:
      version: 3.5.7
    securityContext: {}
