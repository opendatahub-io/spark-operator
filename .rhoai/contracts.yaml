# API contract set for opendatahub-io/spark-operator (RHOAIENG-103187).
# Runner, schemas, and reusable workflows:
# https://github.com/red-hat-data-services/api-contract-tests
apiVersion: contracts.rhoai.io/v1alpha1
kind: ContractSet
metadata:
  name: spark-operator
spec:
  # Repository default baseline: b43103900e5fcb2f665f1f16220edc49aa116c6c,
  # the newest GA release tag spark-operator-2.4.0. Verified 2026-11-20.
  # Moving the baseline forward needs approval from someone other than the
  # author.
  baseline:
    refs:
      - b43103900e5fcb2f665f1f16220edc49aa116c6c
  # Spark Operator has no REST API: this repository ships CRD-driven
  # controllers. The one OpenAPI document is api/openapi-spec/swagger.json,
  # a definitions-only file (zero paths) that openapi-gen writes from the
  # CRD types as the input to Python SDK generation; it carries no
  # information beyond the CRDs, so the CRD compatibility checks in
  # .github/workflows/api-contract.yml cover it and it is excluded here.
  contracts: []
  exclusions:
    - path: api/openapi-spec/swagger.json
      reason: >-
        Definitions-only OpenAPI document (no paths) generated by openapi-gen
        from the CRD types as the input to Python SDK generation; not a
        servable API contract. The schemas it carries are the CRD types,
        covered by the CRD compatibility checks.
