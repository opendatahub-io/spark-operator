---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spark-operator-module-manager-role
rules:
- apiGroups:
  - components.platform.opendatahub.io
  resources:
  - sparkoperators
  verbs:
  - list
  - watch
- apiGroups:
  - components.platform.opendatahub.io
  resourceNames:
  - default-sparkoperator
  resources:
  - sparkoperators
  - sparkoperators/status
  verbs:
  - get
  - patch
  - update
